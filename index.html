<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER.EROS // AUDIO ARCHIVE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090509;
      --card-bg: rgba(18, 10, 18, 0.88);
      --card-border: rgba(255, 0, 85, 0.28);
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #b89ca9;
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      position: relative;
    }

    /* Ambient cyber grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 0, 85, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 85, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 10%, rgba(255, 0, 85, 0.18) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--blush-glow);
      text-transform: uppercase;
      background: rgba(255, 0, 85, 0.09);
      border: 1px solid rgba(255, 0, 85, 0.35);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .heartbeat-icon {
      width: 10px;
      height: 10px;
      background-color: var(--crimson-lust);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--crimson-lust);
      animation: pulse 1.2s infinite;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
      margin-bottom: 0.5rem;
    }

    h1 span { color: var(--neon-pink); }

    .subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2rem;
    }

    .cyber-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
      transition: all 0.35s ease;
      overflow: hidden;
    }

    .cyber-card:hover {
      transform: translateY(-8px);
      border-color: var(--neon-pink);
      box-shadow: 0 12px 35px -8px rgba(255, 0, 85, 0.45);
    }

    /* Card Cover Thumbnail */
    .card-cover-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #1a0d1a;
      overflow: hidden;
    }

    .card-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .cyber-card:hover .card-cover {
      transform: scale(1.05);
    }

    /* Floating Badges on Cover */
    .floating-badges {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-tier {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--gold-tier);
      color: var(--gold-tier);
      text-transform: uppercase;
    }

    .badge-tier.free {
      border-color: var(--cyber-cyan);
      color: var(--cyber-cyan);
    }

    .badge-audience {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      background: rgba(255, 0, 85, 0.85);
      color: #fff;
      letter-spacing: 1px;
    }

    .card-body {
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-display);
      font-size: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .card-id { color: var(--blush-glow); font-weight: 700; }
    .card-tag { color: var(--text-muted); }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .card-credits {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }
    .card-credits span { color: var(--blush-glow); }

    .card-desc {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 1.2rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    /* Trigger chips */
    .triggers-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 1.4rem;
    }

    .trigger-chip {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 3px 7px;
      background: rgba(255, 0, 85, 0.08);
      border: 1px solid rgba(255, 0, 85, 0.3);
      color: var(--blush-glow);
    }

    .cyber-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.85rem;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 0, 85, 0.1);
      border: 1px solid var(--neon-pink);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      transition: all 0.3s ease;
    }

    .cyber-btn:hover {
      background: linear-gradient(90deg, var(--crimson-lust), var(--neon-pink));
      box-shadow: 0 0 20px var(--neon-pink);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="status-badge">
        <span class="heartbeat-icon"></span>
        AUDIO ARCHIVE // NEURAL PROTOCOLS ONLINE
      </div>
      <h1>Cyber<span>.Eros</span></h1>
      <p class="subtitle">Sensory telemetry, tactile audio, and intimate frequency files</p>
    </header>

    <main class="cards-grid" id="cardsGrid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--blush-glow);">
        FETCHING AUDIO ARCHIVE...
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('cardsGrid');

      try {
        const res = await fetch('data.json');
        const items = await res.json();
        grid.innerHTML = '';

        items.forEach(item => {
          const card = document.createElement('article');
          card.className = 'cyber-card';

          const isFree = (item.tier || '').toUpperCase().includes('FREE');
          const triggers = Array.isArray(item.triggers) ? item.triggers : (item.triggers ? item.triggers.split(',') : []);

          // Fallback image placeholder if cover path fails
          const coverImg = item.cover || `https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80`;

          card.innerHTML = `
            <div class="card-cover-wrapper">
              <img src="${coverImg}" alt="${item.title}" class="card-cover" onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80'">
              <div class="floating-badges">
                <span class="badge-tier ${isFree ? 'free' : ''}">${item.tier || 'STANDARD'}</span>
                <span class="badge-audience">${item.audience || 'ANY'}</span>
              </div>
            </div>

            <div class="card-body">
              <div class="card-meta">
                <span class="card-id">${item.id || 'SYS'}</span>
                <span class="card-tag">${item.tag || 'AUDIO'}</span>
              </div>
              
              <h2 class="card-title">${item.title}</h2>
              <div class="card-credits">By <span>${item.author || 'Unknown'}</span> // Voice: <span>${item.artist || 'Unknown'}</span></div>
              <p class="card-desc">${item.description}</p>
              
              <div class="triggers-wrap">
                ${triggers.map(t => `<span class="trigger-chip">${t.trim()}</span>`).join('')}
              </div>

              <a href="detail.html?id=${item.uuid || item.id}" class="cyber-btn">
                Stream & Telemetry &rarr;
              </a>
            </div>
          `;

          grid.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--crimson-lust);">FAILED TO LOAD ARCHIVE DATA</div>`;
      }
    });
  </script>
</body>
</html>
